_format_version: "2.1"

services:
  - name: market-service
    url: http://market-service:8080
    routes:
      - name: market-service-route
        paths:
          - /api/market
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:8081
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              credentials: true
      - name: market-docs
        paths:
          - /docs/market-service
        strip_path: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /v3/api-docs
          - name: cors
            config:
              origins:
                - http://localhost:8081
              methods:
                - GET
                - OPTIONS
              credentials: true

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: user-service-route
        paths:
          - /api/user
        strip_path: false
        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:8081
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              credentials: true
      - name: user-docs
        paths:
          - /docs/user-service
        strip_path: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /v3/api-docs
          - name: cors
            config:
              origins:
                - http://localhost:8081
              methods:
                - GET
                - OPTIONS
              credentials: true