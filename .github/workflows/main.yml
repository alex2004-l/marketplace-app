name: CI/CD Pipeline

on:
  push:
    branches: 
      - "main"
      - "user-service"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build User Service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
      
      - name: Build Market Service
        uses: docker/build-push-action@v5
        with:
          context: ./market-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/market-service:latest

      - name: Build IO Service
        uses: docker/build-push-action@v5
        with:
          context: ./io-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/io-service:latest
